name: Hotfix check

on:
  push:
    branches:
      - fix/deleted-stripe-customer-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run validation suite
        run: npm run check
      - name: Report hotfix source hashes
        if: always()
        run: |
          sha256sum src/worker.js
          sha256sum scripts/smoke-worker.mjs
          sha256sum scripts/smoke-worker-staging.mjs
      - name: Verify reviewed source manifest
        run: sha256sum -c SHA256SUMS.txt
