name: Deploy B.O.T.D. to Cloudflare STAGING
run-name: Staging deployment (${{ github.event_name == 'workflow_dispatch' && inputs.deploy_ref || 'main' }})

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/deploy-staging.yml"
      - "docs/**"
      - "README.md"
      - "SHA256SUMS.txt"
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Reviewed staging source to deploy"
        required: true
        type: choice
        default: feature/v7-cloud-playbook-foundation
        options:
          - feature/v7-cloud-playbook-foundation
          - main

permissions:
  contents: read

concurrency:
  group: botd-cloudflare-staging-deployment
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.repository == 'edw00rd/botd-app-staging' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.botdhockey.com
    steps:
      - name: Check out the selected staging source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Enforce staging-only Cloudflare configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          assert.equal(cfg.name, 'botd-app-staging');
          assert.equal(cfg.vars.ENVIRONMENT, 'staging');
          assert.equal(cfg.vars.APP_URL, 'https://staging.botdhockey.com');
          assert.equal(cfg.vars.SUPABASE_URL, 'https://dolbsnodupgppvwnnlgd.supabase.co');
          assert.equal(cfg.keep_vars, true);
          assert.equal(cfg.workers_dev, false);
          assert.equal(cfg.preview_urls, false);
          console.log('Staging-only Cloudflare configuration verified.');
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Validate exact source checksums and run all tests
        run: |
          sha256sum -c SHA256SUMS.txt
          npm run check
          npm run build:staging

      - name: Verify Cloudflare credentials are configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing Cloudflare credentials. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as staging environment secrets (or repository Actions secrets)."
            exit 1
          fi

      - name: Verify Cloudflare account token before deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          if (!/^[a-fA-F0-9]{32}$/.test(account)) {
            console.error('::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character Cloudflare Account ID, not the Zone ID or account name.');
            process.exit(1);
          }
          if (!token || /\s/.test(token) || /^(Bearer\s|curl\s)/i.test(token)) {
            console.error('::error::CLOUDFLARE_API_TOKEN must contain only the complete API token value (no spaces, quotes, Bearer prefix or curl command).');
            process.exit(1);
          }
          let result;
          try {
            result = await fetch(
              'https://api.cloudflare.com/client/v4/accounts/' + account + '/tokens/verify',
              { headers: { Authorization: 'Bearer ' + token }, signal: AbortSignal.timeout(15000) }
            );
          } catch (error) {
            console.error('::error::Unable to reach the Cloudflare token verification endpoint: ' + String(error.message || error));
            process.exit(1);
          }
          let payload = {};
          try { payload = await result.json(); } catch {}
          if (!result.ok || payload.success !== true || payload.result?.status !== 'active') {
            const codes = Array.isArray(payload.errors)
              ? payload.errors.map(e => e.code).filter(code => Number.isInteger(code)).join(', ')
              : 'unknown';
            console.error('::error::Cloudflare rejected the account API token. HTTP ' + result.status + ', error codes: ' + (codes || 'none') + '. Verify that CLOUDFLARE_API_TOKEN holds the token secret (not its ID), that it is active, and that CLOUDFLARE_ACCOUNT_ID belongs to the same Cloudflare account. Use an account-owned token for the staging Worker.');
            process.exit(1);
          }
          console.log('Cloudflare account token is active for the selected account. Continuing to guarded staging deployment.');
          NODE

      - name: Deploy through existing guarded staging release gate
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          set -o pipefail
          npm run deploy:staging 2>&1 | tee "$RUNNER_TEMP/botd-staging-deploy.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const log = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'botd-staging-deploy.log'),'utf8');
          const version = log.match(/Current Version ID:\s*([0-9a-f-]{36})/i)?.[1];
          if (!version) {
            console.error('::error::Wrangler completed without an identifiable deployed Worker version ID.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version_id=' + version + '\n');
          console.log('Recorded deployed staging Worker version: ' + version);
          NODE

      - name: Verify active staging deployment through Cloudflare API
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYED_VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const version = process.env.DEPLOYED_VERSION_ID;
          assert.match(version || '', /^[0-9a-f-]{36}$/i, 'Deployed staging version ID is required');
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const endpoint = 'https://api.cloudflare.com/client/v4/accounts/' +
            account + '/workers/scripts/botd-app-staging/deployments?per_page=1';
          const response = await fetch(endpoint, {
            headers: { Authorization: 'Bearer ' + token },
            signal: AbortSignal.timeout(15000)
          });
          const body = await response.json();
          if (!response.ok || body.success !== true) {
            const codes = Array.isArray(body.errors)
              ? body.errors.map(e => e.code).filter(Number.isInteger).join(',')
              : 'unknown';
            console.error('::error::Unable to verify staging deployment through Cloudflare API. HTTP ' +
              response.status + ', codes: ' + (codes || 'none'));
            process.exit(1);
          }
          const latest = body.result?.deployments?.[0];
          const active = latest?.versions || [];
          const matched = active.some(item =>
            item.version_id?.toLowerCase() === version.toLowerCase() &&
            Number(item.percentage) === 100
          );
          if (!matched) {
            console.error('::error::Uploaded staging Worker version ' + version +
              ' is not the version currently serving 100% of staging Worker traffic. ' +
              'Check Workers & Pages > botd-app-staging > Deployments before promoting.');
            process.exit(1);
          }
          console.log('Cloudflare confirms Worker botd-app-staging version ' + version +
            ' is the active deployment at 100%.');

          const source = fs.readFileSync('src/worker.js', 'utf8');
          const stable = source.match(/const RELEASE_VERSION = "([^"]+)";/)?.[1];
          const preview = source.match(/const STAGING_PREVIEW_VERSION = "([^"]+)";/)?.[1];
          assert.ok(stable, 'Release version missing from source');
          const expected = preview ? preview + '-staging' : stable + '-staging-v1';

          let liveHealth = 'Not verified (site is protected by Cloudflare Access)';
          try {
            const response = await fetch('https://staging.botdhockey.com/api/health?ci=' +
              Date.now(), {
                headers: { 'Cache-Control': 'no-cache' },
                redirect: 'manual',
                signal: AbortSignal.timeout(10000)
              });
            if (response.headers.get('content-type')?.includes('application/json')) {
              const data = await response.json();
              if (data.ok === true && data.environment === 'staging' &&
                  data.version === expected && data.mode === 'staging-test-only') {
                liveHealth = 'Verified: ' + data.version;
                console.log('Staging health endpoint verified: ' + data.version);
              } else {
                liveHealth = 'Response received, but health/version requires review';
                console.warn('Staging health JSON did not match expected healthy version; review app configuration.');
              }
            } else {
              console.log('Live health request returned non-JSON (such as Cloudflare Access login); ' +
                'this does not invalidate the Cloudflare API deployment verification.');
            }
          } catch (error) {
            console.log('Live health check was not accessible without Access login: ' +
              String(error.message || error));
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            const revision = execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '### B.O.T.D. staging deployment\n\n' +
              '- Worker: botd-app-staging\n' +
              '- Active Cloudflare version (100%): ' + version + '\n' +
              '- Checked-out source commit: ' + revision + '\n' +
              '- Expected app release: ' + expected + '\n' +
              '- Site: https://staging.botdhockey.com\n' +
              '- HTTP health: ' + liveHealth + '\n' +
              '- Production: unchanged\n');
          }
          NODE
