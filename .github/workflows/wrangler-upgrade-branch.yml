name: Wrangler 4.157.0 branch update

on:
  push:
    branches:
      - chore/wrangler-4.157.0
    paths:
      - "requests/wrangler-upgrade.request.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: chore/wrangler-4.157.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install reviewed Wrangler version
        run: npm install --save-dev --package-lock-only wrangler@4.157.0

      - name: Refresh reviewed source manifest entries
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const crypto=require("crypto");
          const files=["package.json","package-lock.json"];
          let lines=fs.readFileSync("SHA256SUMS.txt","utf8").trimEnd().split("\n");
          for (const file of files) {
            const hash=crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            const suffix="  "+file;
            const index=lines.findIndex((line)=>line.endsWith(suffix));
            if (index < 0) throw new Error("Missing manifest entry: "+file);
            lines[index]=hash+suffix;
          }
          fs.writeFileSync("SHA256SUMS.txt",lines.join("\n")+"\n");
          NODE

      - name: Install exact proposed lockfile
        run: npm ci

      - name: Verify audit and application
        run: |
          npm audit --audit-level=high
          npm run check
          sha256sum -c SHA256SUMS.txt
          npm run build:staging
          npm run build:production

      - name: Commit dependency-only update
        shell: bash
        run: |
          git config user.name "BOTD Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: update Wrangler to 4.157.0"
          git push origin HEAD:chore/wrangler-4.157.0
